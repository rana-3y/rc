<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiCA-s</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        .time-box { background: #e9ecef; padding: 15px; border-radius: 5px; text-align: center; font-size: 1.4em; font-weight: bold; margin-bottom: 20px; font-family: monospace; }
        .chat-box { background: #fafafa; border: 1px solid #ddd; height: 250px; overflow-y: auto; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .msg { margin-bottom: 10px; padding: 8px; border-bottom: 1px dashed #eee; border-radius: 4px; }
        
        /* 管理者用のオレンジ色スタイル */
        .msg.admin-msg { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        .admin-badge { color: #fd7e14; font-weight: bold; margin-right: 5px; }

        .msg-time { font-size: 0.8em; color: #888; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        input[type="text"] { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>🗺️ 現在時刻(接続先:Tōkai)</h2>
    <div class="time-box" id="liveClock">読み込み中...</div>

    <h2>👤 自己紹介</h2>
    <p><strong>名前:</strong> らな</p>
    <p><strong>趣味:</strong> マイクラ、散歩＆お風呂！</p>
    <p><strong>一言:</strong> 一言？なにそれおいしいの？</p>

    <h2>💬 グローバルチャット</h2>
    <div class="chat-box" id="chatBox">
        <p style="color:#aaa; text-align:center;">読み込み中...</p>
    </div>

    <form id="chatForm" class="input-group">
        <input type="text" id="username" placeholder="名前（省略可）" maxlength="15">
        <input type="text" id="message" placeholder="メッセージを入力してね" required maxlength="100">
        <button type="submit">送信する</button>
    </form>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const liveClock = document.getElementById('liveClock');

    function updateClock() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ms = String(now.getMilliseconds()).padStart(3, '0').substring(0, 2);
        liveClock.textContent = `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}.${ms}`;
    }
    setInterval(updateClock, 10);

    async function loadMessages() {
        try {
            const response = await fetch('./get_messages');
            const messages = await response.json();
            if (messages.length === 0) {
                chatBox.innerHTML = '<p style="color:#aaa; text-align:center;">まだメッセージがありません。最初の投稿をどうぞ！</p>';
                return;
            }
            let html = '';
            messages.forEach(msg => {
                const adminClass = msg.is_admin ? 'admin-msg' : '';
                const adminBadge = msg.is_admin ? '<span class="admin-badge">[ADMIN]</span>' : '';

                html += `
                    <div class="msg ${adminClass}">
                        ${adminBadge}<strong>${msg.name}</strong> <span class="msg-time">[${msg.time}]</span><br>
                        ${msg.text}
                    </div>
                `;
            });
            chatBox.innerHTML = html;
        } catch (error) {
            console.error('エラー:', error);
        }
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const message = document.getElementById('message').value;
        const formData = new FormData();
        formData.append('username', username);
        formData.append('message', message);

        await fetch('./send_message', { method: 'POST', body: formData });
        document.getElementById('message').value = '';
        loadMessages();
    });

    loadMessages();
    setInterval(loadMessages, 3000);
</script>

</body>
</html>
