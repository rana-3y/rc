<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rci</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        .time-box { background: #e9ecef; padding: 15px; border-radius: 5px; text-align: center; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; }
        .chat-box { background: #fafafa; border: 1px solid #ddd; height: 250px; overflow-y: auto; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .msg { margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px dashed #eee; }
        .msg-time { font-size: 0.8em; color: #888; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        input[type="text"] { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <!-- ① 現在時刻エリア -->
    <h2>🗺️ 現在時刻(接続先:Tōkai)</h2>
    <div class="time-box">
        {{ current_time }}
    </div>

    <!-- ② 自己紹介エリア -->
    <h2>👤 自己紹介</h2>
    <p><strong>名前:</strong> らな</p>
    <p><strong>趣味:</strong> マイクラ、散歩＆お風呂！</p>
    <p><strong>一言:</strong> 一言？なにそれおいしいの？</p>

    <!-- ③ グローバルチャットエリア -->
    <h2>💬 グローバルチャット</h2>
    <div class="chat-box" id="chatBox">
        <p style="color:#aaa; text-align:center;">読み込み中...</p>
    </div>

    <!-- 送信しても画面が切り替わらないように、JavaScriptで処理する形に変更 -->
    <form id="chatForm" class="input-group">
        <input type="text" id="username" placeholder="名前（省略可）" maxlength="15">
        <input type="text" id="message" placeholder="メッセージを入力してね" required maxlength="100">
        <button type="submit">送信する</button>
    </form>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');

    // サーバーからメッセージを取得して画面を書き換える関数
    async function loadMessages() {
        try {
            const response = await fetch('/get_messages');
            const messages = await response.json();
            
            if (messages.length === 0) {
                chatBox.innerHTML = '<p style="color:#aaa; text-align:center;">まだメッセージがありません。最初の投稿をどうぞ！</p>';
                return;
            }

            // メッセージをHTMLに組み立てる
            let html = '';
            messages.forEach(msg => {
                html += `
                    <div class="msg">
                        <strong>${msg.name}</strong> <span class="msg-time">[${msg.time}]</span><br>
                        ${msg.text}
                    </div>
                `;
            });
            
            chatBox.innerHTML = html;
        } catch (error) {
            console.error('メッセージの取得に失敗:', error);
        }
    }

    // フォームが送信されたときの処理（画面をリロードさせない）
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // ページ切り替えをストップ
        
        const username = document.getElementById('username').value;
        const message = document.getElementById('message').value;

        const formData = new FormData();
        formData.append('username', username);
        formData.append('message', message);

        // サーバーにデータを送信
        await fetch('/send_message', {
            method: 'POST',
            body: formData
        });

        document.getElementById('message').value = ''; // 入力欄を空にする
        loadMessages(); // 送信したらすぐにメッセージを更新
    });

    // ページを開いたときにまず一回読み込む
    loadMessages();

    // 3秒（3000ミリ秒）ごとに自動でメッセージを読み直す
    setInterval(loadMessages, 3000);
</script>

</body>
</html>
